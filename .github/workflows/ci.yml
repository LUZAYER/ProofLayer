name: ProofLayer CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Lint
        run: ruff check .

      - name: Run Mypy Type Check
        run: mypy services sdk eval tests

      - name: Run Tests with Coverage
        run: pytest tests/ --cov=services --cov-report=xml --cov-fail-under=80

      - name: Run Evaluation Smoke Test
        run: python eval/run_eval.py --smoke
