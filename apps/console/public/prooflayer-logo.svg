<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="480" height="480" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#3dff8f" opacity="0.09"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <g id="art" color="#3dff8f" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <!-- infra: hexagon frame -->
      <path d="M120 14 L212 67 V173 L120 226 L28 173 V67 Z" stroke-width="4" opacity="0.55"/>

      <!-- tech: chip + pins -->
      <rect x="82" y="74" width="76" height="76" rx="10" fill="#07140e" stroke-width="6"/>
      <path d="M102 62V74 M120 62V74 M138 62V74 M102 150V162 M120 150V162 M138 150V162
               M70 93H82 M70 112H82 M70 131H82 M158 93H170 M158 112H170 M158 131H170" stroke-width="4"/>

      <!-- cyber: keyhole -->
      <circle cx="120" cy="104" r="10" fill="currentColor" stroke="none"/>
      <path d="M114 112 L126 112 L131 136 L109 136 Z" fill="currentColor" stroke="none"/>

      <!-- ML: neural net (left) -->
      <g stroke-width="2.2" opacity="0.9">
        <path d="M58 93L40 102M58 93L40 122M58 112L40 102M58 112L40 122M58 131L40 102M58 131L40 122M58 93H70M58 112H70M58 131H70"/>
      </g>
      <g fill="#05090b" stroke-width="2.5">
        <circle cx="58" cy="93" r="4.5"/><circle cx="58" cy="112" r="4.5"/><circle cx="58" cy="131" r="4.5"/>
        <circle cx="40" cy="102" r="4.5"/><circle cx="40" cy="122" r="4.5"/>
      </g>

      <!-- audit: hash chain (right) -->
      <path d="M170 93H180M170 112H180M170 131H180" stroke-width="2.5"/>
      <path d="M192 93H196M192 112H196M192 131H196" stroke-width="0"/>
      <g stroke-width="3" fill="#05090b">
        <rect x="180" y="87" width="14" height="12" rx="2"/>
        <rect x="180" y="106" width="14" height="12" rx="2"/>
        <rect x="180" y="125" width="14" height="12" rx="2"/>
      </g>
      <path d="M187 99V106M187 118V125" stroke-width="3"/>
      <path d="M184 131l2.5 2.5 5-5" stroke-width="2" />

      <!-- cloud / uplink (top) -->
      <path d="M120 62V44 M102 62V56 L92 46 M138 62V56 L148 46" stroke-width="3"/>
      <g fill="#05090b" stroke-width="3">
        <circle cx="120" cy="40" r="5.5"/><circle cx="90" cy="43" r="4.5"/><circle cx="150" cy="43" r="4.5"/>
      </g>

      <!-- layers (bottom) -->
      <path d="M72 172 L120 190 L168 172" stroke-width="5"/>
      <path d="M84 187 L120 201 L156 187" stroke-width="5" opacity="0.65"/>
      <path d="M98 202 L120 211 L142 202" stroke-width="5" opacity="0.35"/>
    </g>
  </defs>

  <rect width="240" height="240" rx="44" fill="#05090b"/>
  <rect width="240" height="240" rx="44" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="237" height="237" rx="42.5" fill="none" stroke="#3dff8f" stroke-opacity="0.18" stroke-width="3"/>

  <use href="#art" filter="url(#glow)" opacity="0.6"/>
  <use href="#art"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
